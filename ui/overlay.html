<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Speachy</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      body {
        font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .pill {
        position: fixed;
        inset: 7px 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 8px 0 14px;
        border-radius: 21px;
        background: rgb(22 24 29 / 0.94);
        border: 1px solid rgb(255 255 255 / 0.12);
        color: #f2f2f3;
        box-sizing: border-box;
      }
      .bars {
        display: flex;
        align-items: center;
        gap: 2.5px;
        height: 20px;
        flex: none;
      }
      .bars i {
        width: 3px;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(#ffbe50, #ff7056);
        transform: scaleY(0.25);
        transform-origin: center;
      }
      .pill[data-state="speaking"] .bars i {
        animation: wave 0.9s ease-in-out infinite;
      }
      .pill[data-state="loading"] .bars i,
      .pill[data-state="preparing"] .bars i {
        animation: wave 1.6s ease-in-out infinite;
        opacity: 0.55;
      }
      .bars i:nth-child(2) { animation-delay: -0.15s; }
      .bars i:nth-child(3) { animation-delay: -0.3s; }
      .bars i:nth-child(4) { animation-delay: -0.45s; }
      .bars i:nth-child(5) { animation-delay: -0.6s; }
      @keyframes wave {
        0%, 100% { transform: scaleY(0.25); }
        50% { transform: scaleY(1); }
      }
      #label {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: rgb(255 255 255 / 0.82);
      }
      button {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgb(255 255 255 / 0.1);
        color: #fff;
        flex: none;
      }
      button:hover { background: rgb(255 255 255 / 0.22); }
      button svg { width: 12px; height: 12px; fill: currentColor; }
      .pill[data-state="idle"] button { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .bars i { animation: none !important; transform: scaleY(0.6); }
      }
    </style>
  </head>
  <body>
    <div class="pill" id="pill" data-state="idle">
      <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
      <span id="label">Speachy</span>
      <button id="pause" title="Pause" aria-label="Pause">
        <svg viewBox="0 0 12 12" id="pause-icon"><path d="M2.5 1.5h2.4v9H2.5zm4.6 0h2.4v9H7.1z" /></svg>
      </button>
      <button id="stop" title="Stop" aria-label="Stop">
        <svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5" /></svg>
      </button>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
