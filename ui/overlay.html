<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Speachy</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }
      body {
        font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .pill {
        position: fixed;
        inset: 7px 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 7px 0 15px;
        border-radius: 21px;
        background: rgb(17 17 19 / 0.94);
        border: 1px solid rgb(255 255 255 / 0.09);
        color: #f2f2f3;
        box-sizing: border-box;
      }
      /* The bars are drawn by overlay.js from the loudness of the speech
         being heard. One colour, thin, evenly spaced: they should read as a
         voice at a glance and otherwise stay out of the way. */
      .bars {
        display: flex;
        align-items: center;
        gap: 2.5px;
        height: 18px;
        flex: none;
        transition: opacity 0.25s ease;
      }
      .bars i {
        width: 2.5px;
        height: 2.5px;
        border-radius: 2px;
        background: #fff;
        will-change: height;
      }
      .pill[data-state="idle"] .bars { opacity: 0.3; }
      .pill[data-state="paused"] .bars { opacity: 0.4; }
      .pill[data-state="loading"] .bars,
      .pill[data-state="preparing"] .bars {
        opacity: 0.55;
      }
      #label {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: rgb(255 255 255 / 0.82);
      }
      button {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: none;
        color: rgb(255 255 255 / 0.62);
        flex: none;
        transition: background 0.12s ease, color 0.12s ease;
      }
      button:hover { background: rgb(255 255 255 / 0.12); color: #fff; }
      button svg { width: 11px; height: 11px; fill: currentColor; }
      #stop { margin-left: -8px; }
      .pill[data-state="idle"] button:not(#speed) { display: none; }
      #speed {
        width: auto;
        min-width: 38px;
        padding: 0 6px;
        border-radius: 14px;
        font: inherit;
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.01em;
      }
      #speed[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div class="pill" id="pill" data-state="idle">
      <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <span id="label">Speachy</span>
      <button id="speed" hidden></button>
      <button id="pause" title="Pause" aria-label="Pause">
        <svg viewBox="0 0 12 12" id="pause-icon"><path d="M2.5 1.5h2.4v9H2.5zm4.6 0h2.4v9H7.1z" /></svg>
      </button>
      <button id="stop" title="Stop" aria-label="Stop">
        <svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1.5" /></svg>
      </button>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
