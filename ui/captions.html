<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Speachy captions</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
        /* The window ignores the mouse; nothing here may look clickable. */
        pointer-events: none;
      }
      body {
        font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        position: fixed;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%);
        height: 46px;
        width: 0;
        max-width: 664px;
        box-sizing: border-box;
        border-radius: 17px;
        background: rgb(17 17 19 / 0.94);
        border: 1px solid rgb(255 255 255 / 0.09);
        color: #fff;
        overflow: hidden;
        opacity: 0;
        transition: width 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.18s ease;
      }
      body[data-on="true"] .card { opacity: 1; }
      /* Paused, or waiting for the next chunk: the words stay, quieter. */
      body[data-state="paused"] .line,
      body[data-state="preparing"] .line {
        opacity: 0.5;
      }
      body[data-state="paused"] .chip,
      body[data-state="preparing"] .chip {
        opacity: 0.45;
      }
      .line {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        width: max-content;
        display: flex;
        align-items: center;
        padding: 0 22px;
        white-space: nowrap;
        font: 600 20px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        letter-spacing: -0.012em;
        transform-origin: left center;
        transition: opacity 0.2s ease;
      }
      #measure { visibility: hidden; }
      .w {
        position: relative;
        z-index: 1;
        margin-right: 0.5em;
        color: rgb(255 255 255 / 0.74);
        transition: color 0.12s ease, transform 0.13s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .w:last-child,
      .w.tight { margin-right: 0; }
      .w.read { color: rgb(255 255 255 / 0.4); }
      /* The word being read: white and slightly larger. A transform, so no
         other word moves. */
      .w.now { color: #fff; transform: scale(var(--grow, 1.09)); }
      /* One highlight that glides from word to word: in motion it hides a
         timing error of a few tens of milliseconds better than a jump. */
      .chip {
        position: absolute;
        top: 7px;
        height: 30px;
        left: 0;
        width: 0;
        border-radius: 9px;
        background: rgb(255 255 255 / 0.14);
        transition: transform 0.13s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.13s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
        will-change: transform, width;
      }
      .chip.jump { transition: none; }
      @media (prefers-reduced-motion: reduce) {
        .card,
        .chip,
        .w {
          transition: none;
        }
        .w.now { transform: none; }
      }
    </style>
  </head>
  <body data-on="false" data-state="idle">
    <div class="card" id="card">
      <div class="chip jump" id="chip"></div>
      <div class="line" id="line"></div>
      <div class="line" id="measure" aria-hidden="true"></div>
    </div>
    <script src="captions.js"></script>
  </body>
</html>
