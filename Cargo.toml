[workspace]
resolver = "2"
members = ["crates/speachy-core", "crates/speachy-cli", "src-tauri"]
default-members = ["crates/speachy-core", "crates/speachy-cli"]

[workspace.package]
version = "0.1.1"
edition = "2021"
repository = "https://github.com/AaLexUser/speachy"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# TTS inference runs in the prebuilt sherpa-onnx library, but text chunking,
# resampling and sample conversion are ours: keep them fast in `cargo run`.
[profile.dev.package.speachy-core]
opt-level = 2
