name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libssl-dev libxdo-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # sherpa-onnx-sys downloads its prebuilt library into
      # target/sherpa-onnx-prebuilt, and skips the download when the extracted
      # directory exists. The cache restores that directory without the
      # library files in it, which breaks linking. Start it from scratch on
      # every run instead: a 20 MB download.
      - name: Fetch the sherpa-onnx library afresh
        shell: bash
        run: rm -rf target/sherpa-onnx-prebuilt target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-*
      - run: cargo fmt --all --check
      - name: Engine and CLI stay free of UI dependencies
        run: scripts/check-layers.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos:
    name: Build (macOS, Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # sherpa-onnx-sys downloads its prebuilt library into
      # target/sherpa-onnx-prebuilt, and skips the download when the extracted
      # directory exists. The cache restores that directory without the
      # library files in it, which breaks linking. Start it from scratch on
      # every run instead: a 20 MB download.
      - name: Fetch the sherpa-onnx library afresh
        shell: bash
        run: rm -rf target/sherpa-onnx-prebuilt target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-*
      - name: Test the engine and the CLI
        run: cargo test -p speachy-core -p speachy-cli
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build Speachy.app and the disk image
        run: cargo tauri build --bundles app,dmg
      - name: Launch the app
        run: scripts/smoke-app.sh target/release/bundle/macos/Speachy.app/Contents/MacOS/speachy
      # Full screen in another app, select text, press the shortcut. Not yet
      # required to pass: it depends on what the runner's desktop allows.
      - name: Use the app like a user (shortcut, selection, pill over a full-screen app)
        continue-on-error: true
        run: |
          cargo build --release -p speachy-cli
          scripts/e2e-macos.sh target/release/bundle/macos/Speachy.app/Contents/MacOS/speachy target/release/speachy-cli e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-macos
          path: e2e
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Speachy-macos-arm64
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      # Last, because it rebuilds the app bundle with a throwaway signing key.
      - name: Update the app from a local update server
        run: scripts/e2e-update-macos.sh
