name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libasound2-dev libssl-dev libxdo-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # sherpa-onnx-sys downloads its prebuilt library into
      # target/sherpa-onnx-prebuilt. The cache keeps that directory but not
      # its contents, and keeps the build-script output that points into it.
      # Without the library, make the build script run again.
      - name: Re-fetch the sherpa-onnx library if the cache dropped it
        shell: bash
        run: |
          if ! find target/sherpa-onnx-prebuilt -name 'libsherpa-onnx-c-api.*' 2>/dev/null | grep -q .; then
            rm -rf target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-*
          fi
      - run: cargo fmt --all --check
      - name: Engine and CLI stay free of UI dependencies
        run: scripts/check-layers.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  macos:
    name: Build (macOS, Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # sherpa-onnx-sys downloads its prebuilt library into
      # target/sherpa-onnx-prebuilt. The cache keeps that directory but not
      # its contents, and keeps the build-script output that points into it.
      # Without the library, make the build script run again.
      - name: Re-fetch the sherpa-onnx library if the cache dropped it
        shell: bash
        run: |
          if ! find target/sherpa-onnx-prebuilt -name 'libsherpa-onnx-c-api.*' 2>/dev/null | grep -q .; then
            rm -rf target/*/build/sherpa-onnx-sys-* target/*/.fingerprint/sherpa-onnx-sys-*
          fi
      - name: Test the engine and the CLI
        run: cargo test -p speachy-core -p speachy-cli
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build Speachy.app and the disk image
        run: cargo tauri build --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: Speachy-macos-arm64
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
